<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskify Workspace</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --ink: #14171C;
    --muted: #667085;
    --line: #E3E6EB;
    --accent: #2F5BEA;
    --accent-ink: #FFFFFF;
    --tag-new: #1C7C54;
    --tag-improved: #2F5BEA;
    --tag-fixed: #B54708;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1217;
      --surface: #171B22;
      --ink: #EDF0F5;
      --muted: #8E98A8;
      --line: #262C36;
      --accent: #6B8CFF;
      --accent-ink: #0F1217;
      --tag-new: #4CC38A;
      --tag-improved: #6B8CFF;
      --tag-fixed: #F0A04B;
    }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .brand {
    position: absolute; top: 24px; left: 28px;
    display: flex; align-items: center; gap: 12px;
    text-decoration: none; font-weight: 600; font-size: 18px;
  }
  .brand img { width: 36px; height: 36px; display: block; }

  main { max-width: 760px; margin: 0 auto; padding: 112px 24px 96px; }

  .latest-preview {
    width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block;
    border-radius: 16px; border: 1px solid var(--line); background: var(--surface);
    margin-bottom: 36px;
  }
  .latest-preview[hidden] { display: none; }

  h1 { font-size: 40px; line-height: 1.12; margin: 0 0 10px; font-weight: 700; letter-spacing: -0.02em; }
  .tagline { margin: 0 0 28px; color: var(--muted); font-size: 19px; max-width: 34em; }

  .actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 52px; }
  .btn {
    display: inline-block; padding: 13px 24px; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 600; text-decoration: none;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .meta { color: var(--muted); font-size: 15px; }

  h2 { font-size: 22px; margin: 0 0 4px; font-weight: 600; letter-spacing: -0.01em; }
  .release-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .release-head .date { color: var(--muted); font-size: 15px; }

  .changes { list-style: none; padding: 0; margin: 14px 0 0; }
  .changes li { display: flex; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); }
  .changes li:first-child { border-top: 0; }
  .tag { flex: 0 0 96px; font-size: 14px; font-weight: 600; padding-top: 1px; }
  .tag.new { color: var(--tag-new); }
  .tag.improved { color: var(--tag-improved); }
  .tag.fixed { color: var(--tag-fixed); }

  .older { margin-top: 64px; }
  .older h2 { margin-bottom: 14px; }
  details { border-top: 1px solid var(--line); padding: 14px 0; }
  details:last-of-type { border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; display: flex; align-items: baseline; gap: 12px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: ""; width: 7px; height: 7px; flex: none; align-self: center;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg); transition: transform .15s ease;
  }
  details[open] summary::before { transform: rotate(45deg); }
  summary .v { font-weight: 600; }
  summary .date { color: var(--muted); font-size: 15px; }
  summary .dl { margin-left: auto; font-size: 15px; color: var(--accent); text-decoration: none; }
  summary .dl:hover { text-decoration: underline; }

  .notice { padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); }

  @media (max-width: 560px) {
    main { padding-top: 96px; }
    h1 { font-size: 32px; }
    .tag { flex-basis: 84px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  .topbar { position: absolute; top: 20px; right: 28px; display: flex; gap: 10px; align-items: center; }
  .chip {
    font: inherit; font-size: 15px; font-weight: 500; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 14px; cursor: pointer; line-height: 1.2;
  }
  .chip:hover { border-color: var(--muted); }
  .chip.flag { font-size: 20px; padding: 4px 10px; }
  dialog {
    width: calc(100% - 48px); max-width: 520px; padding: 28px;
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface); color: var(--ink);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h2 { margin-bottom: 14px; }
  dialog p { margin: 0 0 12px; }
  dialog .facts { margin: 18px 0 22px; color: var(--muted); font-size: 15px; }
  dialog .facts div { display: flex; gap: 8px; padding: 4px 0; }
  dialog .facts b { color: var(--ink); font-weight: 500; }
  @media (max-width: 560px) { .topbar { right: 16px; } .brand { left: 16px; } }
</style>
</head>
<body>

<a class="brand" href="./" id="brand">
  <img id="logo" alt="" width="36" height="36" hidden>
  <span id="brand-name"></span>
</a>

<div class="topbar">
  <button class="chip" id="about-btn" type="button"></button>
  <button class="chip flag" id="lang-btn" type="button"></button>
</div>

<main id="app" aria-live="polite"></main>

<dialog id="about"></dialog>

<script>
/* Весь контент берётся из releases.json — код страницы менять не нужно.
   Тексты можно писать строкой или так: {"ru": "...", "en": "..."} */
const UI = {
  ru: {
    tags: { new: "Новое", improved: "Улучшено", fixed: "Исправлено" },
    download: "Скачать", whatsNew: "Что нового в", older: "Предыдущие версии",
    about: "О продукте", close: "Закрыть", platform: "Платформа", latest: "Последняя версия",
    alt: "Окно", locale: "ru-RU", flag: "🇷🇺", switchTo: "Switch to English",
    empty: "Версий пока нет. Добавьте первую в releases.json.",
    error: "Не удалось загрузить releases.json. Если вы открыли index.html двойным щелчком, запустите сайт через сервер: python -m http.server"
  },
  en: {
    tags: { new: "New", improved: "Improved", fixed: "Fixed" },
    download: "Download", whatsNew: "What’s new in", older: "Previous versions",
    about: "About", close: "Close", platform: "Platform", latest: "Latest version",
    alt: "Window of", locale: "en-US", flag: "🇬🇧", switchTo: "Переключить на русский",
    empty: "No releases yet. Add the first one to releases.json.",
    error: "Could not load releases.json. If you opened index.html by double-clicking it, serve the site instead: python -m http.server"
  }
};

let DATA = null;
let lang = "ru";
try {
  lang = localStorage.getItem("lang") || ((navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en");
} catch (e) { lang = "ru"; }

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const L = () => UI[lang];
const t = (v) => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] || v.ru || v.en || "") : v;

function parseVersion(v) { return String(v).split(".").map((p) => parseInt(p, 10) || 0); }
function compareVersions(a, b) {
  const x = parseVersion(a), y = parseVersion(b);
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    const d = (y[i] || 0) - (x[i] || 0);
    if (d) return d;
  }
  return 0;
}
function formatDate(s) {
  if (!s) return "";
  const d = new Date(s);
  return isNaN(d) ? s : d.toLocaleDateString(L().locale, { day: "numeric", month: "long", year: "numeric" });
}

function renderChanges(list) {
  const ul = el("ul", "changes");
  (list || []).forEach((c) => {
    const li = el("li");
    li.append(el("span", "tag " + c.type, L().tags[c.type] || c.type), el("span", null, t(c.text)));
    ul.append(li);
  });
  return ul;
}

function renderAbout(product, latest) {
  const d = $("about");
  d.textContent = "";
  d.append(el("h2", null, product.name || ""));
  const paras = t(product.about);
  (Array.isArray(paras) ? paras : (paras ? [paras] : [])).forEach((p) => d.append(el("p", null, p)));
  const facts = el("div", "facts");
  [[L().platform, product.platform], [L().latest, latest && latest.version]].forEach(([k, v]) => {
    if (!v) return;
    const row = el("div");
    row.append(el("span", null, k + ":"), el("b", null, v));
    facts.append(row);
  });
  d.append(facts);
  const close = el("button", "chip", L().close);
  close.type = "button";
  close.addEventListener("click", () => d.close());
  d.append(close);
}

function render() {
  const data = DATA, product = data.product || {};
  const releases = (data.releases || []).slice().sort((a, b) => compareVersions(a.version, b.version));
  const app = $("app");
  app.textContent = "";

  document.documentElement.lang = lang;
  document.title = product.name || "Deskify Workspace";
  $("brand-name").textContent = product.name || "";
  if (product.logo) { $("logo").src = product.logo; $("logo").hidden = false; }
  $("about-btn").textContent = L().about;
  $("lang-btn").textContent = L().flag;
  $("lang-btn").title = L().switchTo;
  $("lang-btn").setAttribute("aria-label", L().switchTo);

  const latest = releases[0];
  renderAbout(product, latest);

  if (!latest) { app.append(el("p", "notice", L().empty)); return; }

  if (latest.preview) {
    const img = el("img", "latest-preview");
    img.src = latest.preview;
    img.alt = L().alt + " " + (product.name || "") + " " + latest.version;
    img.addEventListener("error", () => { img.hidden = true; });
    app.append(img);
  }

  app.append(el("h1", null, product.name || ""));
  if (product.tagline) app.append(el("p", "tagline", t(product.tagline)));

  const actions = el("div", "actions");
  const btn = el("a", "btn", L().download + " " + latest.version);
  btn.href = latest.download;
  btn.setAttribute("download", "");
  actions.append(btn);
  const meta = [product.platform, latest.size].filter(Boolean).join(", ");
  if (meta) actions.append(el("span", "meta", meta));
  app.append(actions);

  const head = el("div", "release-head");
  head.append(el("h2", null, L().whatsNew + " " + latest.version));
  if (latest.date) head.append(el("span", "date", formatDate(latest.date)));
  app.append(head, renderChanges(latest.changes));

  if (releases.length > 1) {
    const older = el("section", "older");
    older.append(el("h2", null, L().older));
    releases.slice(1).forEach((r) => {
      const d = el("details");
      const s = el("summary");
      s.append(el("span", "v", r.version));
      if (r.date) s.append(el("span", "date", formatDate(r.date)));
      const a = el("a", "dl", L().download);
      a.href = r.download;
      a.setAttribute("download", "");
      a.addEventListener("click", (ev) => ev.stopPropagation());
      s.append(a);
      d.append(s, renderChanges(r.changes));
      older.append(d);
    });
    app.append(older);
  }
}

$("lang-btn").addEventListener("click", () => {
  lang = lang === "ru" ? "en" : "ru";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  if (DATA) render();
});
$("about-btn").addEventListener("click", () => { if (DATA) $("about").showModal(); });
$("about").addEventListener("click", (ev) => { if (ev.target === $("about")) $("about").close(); });

fetch("releases.json", { cache: "no-cache" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => { DATA = d; render(); })
  .catch(() => {
    $("about-btn").textContent = L().about;
    $("lang-btn").textContent = L().flag;
    $("app").append(el("p", "notice", L().error));
  });
</script>
</body>
</html>
